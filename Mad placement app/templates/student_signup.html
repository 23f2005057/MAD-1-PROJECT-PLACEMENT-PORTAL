{% extends 'base.html' %}

{% block header %}
  <h1>{% block title %}Student SignUp{% endblock %}</h1>
{% endblock %}

{% block content %}

<div class="container">

  <div class="row justify-content-center">

    <div class="col-md-12 col-lg-9 mb-3">

      <div class="container text-center">
        <h1>Enter Company Details</h1>
      </div>
      

      <div class="card p-4 shadow mb-3">

        <form action="{{ url_for('student_signup') }}" method="POST" >

          <div class="container">
            <h2>Personal Details:</h2>
          </div>

          <div class="card p-4 shadow mb-3">

          <div class="container row justify-content-center">

            <div class="container col-md-4 col-lg-4 mb-3">
              <label for="username">UserName:</label>
              <input name="username" id="username" type="text" class="form-control mt-1" placeholder="Enter UserName" required>
            </div>

            <div class="container col-md-4 col-lg-4  mb-3">
              <label for="Password">Password:</label>
              <input type="password" class="form-control mt-1" placeholder="Password" name="Password" id="Password" required>

            </div>

            <div class="container col-md-4 col-lg-4  mb-3">
              <label for="email">Email:</label>
              <input type="email" class="form-control mt-1" placeholder="abc@xyz.com" name="email" id="email" required>

            </div>

          </div>

          <div class="container row justify-content-center">
          
            <div class="container col-md-4 col-lg-4 mb-3">
              <label for="firstname">FirstName:</label>
              <input name="firstname" id="firstname" type="text" class="form-control mt-1" placeholder="Name" required>
            </div>

            <div class="container col-md-4 col-lg-4  mb-3">
              <label for="lastname">LastName:</label>
              <input type="text" class="form-control mt-1" placeholder="LastName" name="lastname" id="lastname" required>

            </div>

            <div class="container col-md-4 col-lg-4  mb-3">
              <label for="dob">Date Of Birth:</label>
              <input type="date" class="form-control mt-1" name="dob" id="dob" required>

            </div>

          </div>

          <div class="container row justify-content-center">
          
            <div class="container col-md-4 col-lg-4 mb-3">
              <label for="phone">Phone Number:</label>
              <input name="phone" id="phone" type="tel" class="form-control mt-1" placeholder="96XXXXXXXX" required>
            </div>

            <div class="container col-md-4 col-lg-4  mb-3">
              <label for="address">Address:</label>
              <input type="text" class="form-control mt-1" placeholder="address" name="address" id="address" required>

            </div>

            <div class="container col-md-4 col-lg-4  mb-3">
              <label for="gender">Gender:</label><br>
              <input type="radio" id="female" name="gender" value="female">
              <label for="female">Female</label>
              <input type="radio" id="male" name="gender" value="male">
              <label for="male">Male</label>

            </div>

          </div>
        
        </div>

        <div class="card p-4 shadow mb-3">
          
        <div class="container">
          <h2>Educational Details:</h2>
        </div>

        <div class="card p-4 shadow mb-3">

          <div class="container">
            <h>UG Details:</h>
          </div>

        <div class="container row justify-content-center">

          <div class="container col-md-4 col-lg-4 mb-3">
            <label for="ug_collage_name">Collage Name:</label>
            <input name="ug_collage_name" id="ug_collage_name" type="text" class="form-control mt-1" placeholder="xyz Collage" default="NA">
          </div>

          <div class="container col-md-4 col-lg-4  mb-3">
            <label for="ug_degree">Degree:</label>
            <input type="text" class="form-control mt-1" placeholder="Degree" name="ug_degree" id="ug_degree" default="NA">

          </div>

          <div class="container col-md-4 col-lg-4  mb-3">
            <label for="ug_branch">Branch:</label>
            <input type="text" class="form-control mt-1" placeholder="Branch" name="ug_branch" id="ug_branch" default="NA">

          </div>

        </div>

        <div class="container row justify-content-center">
        
          <div class="container col-md-4 col-lg-4 mb-3">
            <label for="ug_graduation_year">Graduation Year:</label>
            <input name="ug_graduation_year" id="ug_graduation_year" type="number" class="form-control mt-1" placeholder="Year" default="NA">
          </div>

          <div class="container col-md-4 col-lg-4  mb-3">
            <label for="ug_cgpa">CGPA:</label>
            <input type="number" class="form-control mt-1" name="ug_cgpa" id="ug_cgpa" step="0.01" min="0" max="10" default="NA">

          </div>

        </div>
      
      </div>

      <div class="card p-4 shadow mb-3">

        <div class="container">
          <h3>PG Details:</h3>
        </div>

      <div class="container row justify-content-center">

        <div class="container col-md-4 col-lg-4 mb-3">
          <label for="pg_collage_name">Collage Name:</label>
          <input name="pg_collage_name" id="pg_collage_name" type="text" class="form-control mt-1" placeholder="xyz Collage" default="NA">
        </div>

        <div class="container col-md-4 col-lg-4  mb-3">
          <label for="pg_degree">Degree:</label>
          <input type="text" class="form-control mt-1" placeholder="Degree" name="pg_degree" id="pg_degree" default="NA">

        </div>

        <div class="container col-md-4 col-lg-4  mb-3">
          <label for="pg_branch">Branch:</label>
          <input type="text" class="form-control mt-1" placeholder="Branch" name="pg_branch" id="pg_branch" default="NA">

        </div>

      </div>

      <div class="container row justify-content-center">
      
        <div class="container col-md-4 col-lg-4 mb-3">
          <label for="pg_graduation_year">Graduation Year:</label>
          <input name="pg_graduation_year" id="pg_graduation_year" type="number" class="form-control mt-1" placeholder="Year" default="NA">
        </div>

        <div class="container col-md-4 col-lg-4 mb-3">
          <label for="pg_cgpa">PG CGPA:</label>
          <input type="number" step="0.01" class="form-control mt-1" name="pg_cgpa" id="pg_cgpa" placeholder="Enter CGPA">
      </div>

      </div>
    
    </div>

    <div class="card p-4 shadow mb-3">

      <div class="container">
        <h3>Resume Link:</h3>
      </div>
 
      <div class="container col-md-12 col-lg-12 mb-3">
        <input name="resume" id="resume" type="text" class="form-control mt-1" placeholder="xyz.com">
      </div>

    
  
  </div>

  </div>
  <div class="container text-center">
    <button class="btn btn-primary rounded">Submit</button>
  </div>

        
        </form>

      </div>

    </div>

  </div>




</div>

{% endblock %}
