{% extends 'base.html' %}
{% block title %}Company Profile Update{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 mb-3">
      <div class="card p-4 shadow mb-3 mt-4">
        <h2 class="text-center">Update Company Profile</h2>
        <form action="{{ url_for('company_edit_profile') }}" method="POST">

          <div class="mb-3">
            <label>New Password:</label>
            <input type="password" class="form-control" name="password" placeholder="Leave blank to keep same">
          </div>

          <div class="mb-3">
            <label>Company Name:</label>
            <input type="text" class="form-control" name="name" value="{{ company.name }}">
          </div>

          <div class="mb-3">
            <label>Industry:</label>
            <input type="text" class="form-control" name="industry" value="{{ company.industry }}">
          </div>

          <div class="mb-3">
            <label>Website:</label>
            <input type="url" class="form-control" name="website" value="{{ company.website or '' }}">
          </div>

          <div class="mb-3">
            <label>HR Name:</label>
            <input type="text" class="form-control" name="hr_name" value="{{ company.hr_name }}">
          </div>

          <div class="mb-3">
            <label>HR Contact:</label>
            <input type="tel" class="form-control" name="hr_contact" value="{{ company.hr_contact }}">
          </div>

          <div class="mb-3">
            <label>About Company:</label>
            <textarea class="form-control" name="about" rows="4">{{ company.about_company or '' }}</textarea>
          </div>

          <div class="text-center">
            <button class="btn btn-primary">Update</button>
            <a href="{{ url_for('company_dashboard') }}" class="btn btn-secondary">Cancel</a>
          </div>

        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
